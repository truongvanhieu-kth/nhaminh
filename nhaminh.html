<style>
:root{--bg:#EAF6FF;--bg2:#FFF3D6;--card:#fff;--ink:#2B2D57;--mut:#6B6F9A;--sky:#4DB8FF;--sun:#FFD23F;--coral:#FF6B6B;--mint:#2FCB8A;--grape:#8E6CEF;--line:#D9E6F5;--sh:#B9CCE6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171A3A;--bg2:#22254F;--card:#252954;--ink:#F2F3FF;--mut:#A9ADD8;--line:#383D75;--sh:#0F1129}}
:root[data-theme="dark"]{--bg:#171A3A;--bg2:#22254F;--card:#252954;--ink:#F2F3FF;--mut:#A9ADD8;--line:#383D75;--sh:#0F1129}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Baloo 2","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 0,var(--bg2),transparent 40%),var(--bg);min-height:100vh;font-size:16px;line-height:1.35}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 96px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}
header small{color:var(--mut);display:block;font-weight:500;font-size:14px}
.stars{display:flex;align-items:center;gap:5px;margin-left:auto;background:var(--sun);color:#5a4300;border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 4px 0 #E0A800}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);display:flex;gap:6px;justify-content:center;box-shadow:0 -6px 24px rgba(40,60,120,.15);z-index:5}
nav button{flex:1;max-width:150px;font-size:12px;border:0;background:transparent;color:var(--mut);font:700 13px inherit;font-family:inherit;padding:6px 2px;border-radius:14px;cursor:pointer}
nav button b{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 2px;border-radius:15px;background:var(--bg);color:var(--c);box-shadow:0 4px 0 var(--sh);transition:transform .2s,background .2s}
nav button.on{color:var(--ink);background:var(--bg)}nav button.on b{transform:translateY(-4px);background:var(--c);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 0 var(--sh),0 14px 24px rgba(40,60,120,.12);border:2px solid var(--line);transform-style:preserve-3d;transition:transform .2s}
.tilt:hover{transform:perspective(700px) rotateX(3deg) rotateY(-3deg) translateY(-3px)}
.card h2{display:flex;align-items:center;gap:9px;margin:0 0 8px;font-size:20px;font-weight:800}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,var(--sky),var(--grape));color:#fff;border:0;box-shadow:0 8px 0 #5B45B8,0 18px 30px rgba(80,60,180,.3)}
.hero h2{font-size:24px;color:#fff}.hero p{margin:4px 0 10px;font-weight:500}
.chibi{filter:drop-shadow(0 8px 6px rgba(0,0,0,.18));animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.chibi{animation:none}.card,nav b{transition:none}}
.btn{border:0;border-radius:16px;padding:9px 16px;font:800 15px inherit;font-family:inherit;color:#fff;background:var(--sky);box-shadow:0 5px 0 #2C8FD0;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2C8FD0}
.btn.g{background:var(--mint);box-shadow:0 5px 0 #1C9A66}.btn.c{background:var(--coral);box-shadow:0 5px 0 #CC4747}.btn.y{background:var(--sun);color:#5a4300;box-shadow:0 5px 0 #E0A800}.btn.p{background:var(--grape);box-shadow:0 5px 0 #6444C4}
.btn.sm{padding:5px 11px;font-size:13px;box-shadow:0 3px 0 #2C8FD0}
input,select{font:600 15px inherit;font-family:inherit;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:700}
.bar{height:16px;border-radius:99px;background:var(--bg);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.12)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sky));border-radius:99px;transition:width .4s}
.q{font-size:38px;font-weight:800;text-align:center;margin:6px 0}
.flash{height:150px;display:grid;place-items:center;text-align:center;border-radius:20px;background:linear-gradient(135deg,var(--sun),#FFB36B);color:#4a3200;cursor:pointer;font-weight:800;font-size:30px;box-shadow:0 6px 0 #E09A3D}
.flash span{font-size:44px;display:block}
.list>div{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:2px dashed var(--line)}
.list>div:last-child{border:0}.list .g{flex:1}.mut{color:var(--mut);font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--bg);border-radius:16px;padding:8px;min-height:120px}.day h3{margin:0 0 6px;font-size:14px}
.ev{background:var(--card);border-left:5px solid var(--sky);border-radius:10px;padding:4px 7px;margin-bottom:5px;font-size:13px;font-weight:600}
.timer{font-size:52px;font-weight:800;text-align:center;letter-spacing:2px}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.sub .btn{white-space:nowrap}
.ic{flex:none;vertical-align:middle}.card h2 .ic{color:var(--grape)}.pill .ic{vertical-align:-2px;color:#E0A800}.btn .ic{vertical-align:-4px;margin-right:4px}.tile{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}.inc{color:var(--mint)}.exp{color:var(--coral)}

const DAYS=["T2","T3","T4","T5","T6","T7","CN"],WHO=["Con","Ba","Mẹ","Cả nhà"],COLS={Con:"#4DB8FF",Ba:"#8E6CEF",Mẹ:"#FF6B6B","Cả nhà":"#2FCB8A"};
const WORDS=[["🍎","apple","quả táo"],["🐱","cat","con mèo"],["📚","book","quyển sách"],["🌞","sun","mặt trời"],["🐟","fish","con cá"],["🏠","house","ngôi nhà"],["🚗","car","xe hơi"],["🌸","flower","bông hoa"],["🐶","dog","con chó"],["🥛","milk","sữa"],["🌙","moon","mặt trăng"],["⭐","star","ngôi sao"]];
const def={kid:"Bé",mom:"Ba Mẹ",tab:"home",stars:0,me:0,pa:0,lvl:1,logs:[],ev:[],together:[],goalH:5,tx:[],piggy:{name:"Heo đất ước mơ",goal:500000},chores:[{t:"Dọn đồ chơi",s:2},{t:"Đọc sách 15 phút",s:3},{t:"Phụ ba mẹ dọn bàn ăn",s:2}],done:{},rewards:[{t:"Chọn phim tối thứ 7",c:10},{t:"Đi công viên",c:20}],sub:"quiz"};
let S=load();let Q=newQ(),turn=0,fi=0,fl=false,timer=null,left=900,subj="Toán";
function load(){try{const r=localStorage.getItem("nhaminh");if(r)return Object.assign({},def,JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(def))}

const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fm=n=>Math.round(n).toLocaleString("vi-VN")+"đ",today=()=>new Date().toISOString().slice(0,10);
function chibi(t,sz=90){const c={girl:["#5B3A29","#FF8FB8"],boy:["#2B2D57","#4DB8FF"],mom:["#7A3E2B","#FF6B6B"],dad:["#222","#8E6CEF"]}[t];
const hair=t=="girl"?`<circle cx="22" cy="42" r="12" fill="${c[0]}"/><circle cx="78" cy="42" r="12" fill="${c[0]}"/>`:t=="mom"?`<path d="M18 40Q18 80 28 88L34 50Z M82 40Q82 80 72 88L66 50Z" fill="${c[0]}"/>`:"";
return `<svg class="chibi" width="${sz}" height="${sz}" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="94" rx="20" ry="5" fill="rgba(0,0,0,.12)"/><rect x="33" y="72" width="34" height="22" rx="11" fill="${c[1]}"/>${hair}<circle cx="50" cy="44" r="32" fill="#FFE0C7"/><path d="M18 42Q20 10 50 12Q80 10 82 42Q70 24 50 28Q30 24 18 42Z" fill="${c[0]}"/><ellipse cx="38" cy="48" rx="5" ry="6.5" fill="#2B2D57"/><ellipse cx="62" cy="48" rx="5" ry="6.5" fill="#2B2D57"/><circle cx="40" cy="45.5" r="2" fill="#fff"/><circle cx="64" cy="45.5" r="2" fill="#fff"/><ellipse cx="29" cy="58" rx="6" ry="4" fill="#FF9FA8" opacity=".7"/><ellipse cx="71" cy="58" rx="6" ry="4" fill="#FF9FA8" opacity=".7"/><path d="M43 60Q50 68 57 60" stroke="#C0392B" stroke-width="3" fill="none" stroke-linecap="round"/>${t=="girl"?`<path d="M58 16l6-6 6 6-6 5z" fill="#FFD23F"/>`:""}</svg>`}
function newQ(){const l=S.lvl;let a,b,op,r;if(l==1){a=1+Math.random()*12|0;b=1+Math.random()*(20-a)|0;op=Math.random()<.5?"+":"−";if(op=="−"&&a<b)[a,b]=[b,a];r=op=="+"?a+b:a-b}else if(l==2){a=10+Math.random()*60|0;b=1+Math.random()*30|0;op=Math.random()<.5?"+":"−";if(op=="−"&&a<b)[a,b]=[b,a];r=op=="+"?a+b:a-b}else if(l==3){a=2+Math.random()*8|0;b=2+Math.random()*8|0;op="×";r=a*b}else{b=2+Math.random()*8|0;r=2+Math.random()*9|0;a=b*r;op="÷"}return{t:`${a} ${op} ${b}`,r}}
const TABS=[["home","home","Nhà","#4DB8FF"],["learn","book","Học cùng","#8E6CEF"],["plan","cal","Lịch","#2FCB8A"],["money","wallet","Chi tiêu","#FF9F43"],["chores","star","Việc nhà","#FF6B6B"],["fam","heart","Gia đình","#FF6BA8"]];
function go(t){S.tab=t;save();draw()}
function draw(){const h=new Date().getHours();$("hello").textContent=(h<11?"Chào buổi sáng":h<18?"Chào buổi chiều":"Chào buổi tối")+", "+S.kid+" và "+S.mom;$("logo").innerHTML=chibi("girl",54);$("stars").innerHTML=ic("star",18,1)+" "+starBal();

function home(){const wk=S.logs.filter(l=>Date.now()-l.d<6048e5).reduce((a,l)=>a+l.m,0),tg=S.together.filter(l=>Date.now()-l.d<6048e5).reduce((a,l)=>a+l.m,0),ev=S.ev.filter(e=>e.day==(new Date().getDay()+6)%7);
return `<div class="card hero">${chibi("boy",110)}<div><h2>Hôm nay mình học gì nhỉ?</h2><p>Mỗi ngày 15 phút bên nhau, con giỏi lên từng chút.</p><button class="btn y" onclick="S.sub='quiz';go('learn')">Bắt đầu học cùng con</button></div></div>
<div class="grid" style="margin-top:14px">
<div class="card tilt"><h2><span class="tile" style="background:#FF9F43">${ic("flame",20)}</span> Chuỗi ngày học</h2><div style="font-size:34px;font-weight:800">${streak()} ngày</div><span class="mut">${streak()?"Giữ lửa nhé, mai học tiếp!":"Ghi một buổi học để bắt đầu chuỗi."}</span></div>
<div class="card tilt"><h2><span class="tile" style="background:#FF6B6B">${ic("heart",20,1)}</span> Lời nhắn cho hôm nay</h2><p style="margin:0;font-weight:600">${NOTES[new Date().getDate()%7]}</p></div>
<div class="card tilt"><h2>${ic("book")} Học tuần này</h2><div style="font-size:34px;font-weight:800">${wk} phút</div><span class="mut">${S.logs.length} buổi học đã ghi</span></div>
<div class="card tilt"><h2>${ic("heart")} Giờ bên nhau</h2><div class="bar"><i style="width:${Math.min(100,tg/(S.goalH*60)*100)}%"></i></div><p class="mut">${(tg/60).toFixed(1)} / ${S.goalH} giờ mục tiêu tuần</p></div>
<div class="card tilt"><h2>${ic("cal")} Hôm nay</h2>${ev.length?ev.sort((a,b)=>a.time>b.time?1:-1).map(e=>`<div class="ev" style="border-color:${COLS[e.who]}">${e.time} · ${esc(e.title)} (${e.who})</div>`).join(""):'<p class="mut">Chưa có lịch. Thêm ở tab Lịch nhé.</p>'}</div>

<div class="row" style="justify-content:center">${isP()?`<button class="btn sm p" onclick="rename()">${ic("edit",14)}Đổi tên</button>`:""}<button class="btn sm" onclick="theme()">${ic("moon",14)}Sáng / tối</button></div>`}
function rename(){const k=prompt("Tên của con?",S.kid);if(k)S.kid=k.trim();const m=prompt("Cách gọi ba mẹ?",S.mom);if(m)S.mom=m.trim();save();draw()}

function quiz(){const who=turn%2?S.mom:S.kid;return `<div class="card"><div class="row"><span class="pill">${S.kid}: ${S.me} điểm</span><span class="pill">${esc(S.mom)}: ${S.pa} điểm</span><select onchange="S.lvl=+this.value;Q=newQ();save();draw()"><option value="1" ${S.lvl==1?"selected":""}>Cấp 1: cộng trừ nhỏ</option><option value="2" ${S.lvl==2?"selected":""}>Cấp 2: cộng trừ lớn</option><option value="3" ${S.lvl==3?"selected":""}>Cấp 3: bảng cửu chương</option><option value="4" ${S.lvl==4?"selected":""}>Cấp 4: phép chia</option></select></div>
<div class="row" style="justify-content:center">${chibi(turn%2?"mom":"girl",80)}</div><p style="text-align:center;margin:0" class="mut">Đến lượt <b>${esc(who)}</b></p><div class="q">${Q.t} = ?</div>
<div class="row" style="justify-content:center"><input id="ans" type="number" inputmode="numeric" style="width:120px;font-size:24px;text-align:center" onkeydown="if(event.key=='Enter')check()"><button class="btn g" onclick="check()">Trả lời</button></div><p id="fb" style="text-align:center;font-weight:800;min-height:24px"></p></div>`}

function vocab(){const w=WORDS[fi];return `<div class="card"><h2>Lật thẻ, đọc to cùng con</h2><div class="flash" onclick="fl=!fl;draw()">${fl?`<div>${w[2]}<br><span style="font-size:18px">${w[1]} ${w[0]}</span></div>`:`<div><span>${w[0]}</span>${w[1]}</div>`}</div><p class="mut" style="text-align:center">Chạm vào thẻ để xem nghĩa · ${fi+1}/${WORDS.length}</p><div class="row" style="justify-content:center"><button class="btn" onclick="fi=(fi+WORDS.length-1)%WORDS.length;fl=false;draw()">Thẻ trước</button><button class="btn y" onclick="say(WORDS[fi][1])">Nghe</button><button class="btn g" onclick="fi=(fi+1)%WORDS.length;fl=false;draw()">Thẻ sau</button></div></div>`}
function focus(){const m=Math.floor(left/60),s=left%60;return `<div class="card"><h2>Mỗi người một cuốn sách, cùng học nhé</h2><div class="timer" id="tm">${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}</div><div class="row" style="justify-content:center"><select id="subj" onchange="subj=this.value">${["Toán","Tiếng Việt","Tiếng Anh","Đọc sách","Khác"].map(x=>`<option ${x==subj?"selected":""}>${x}</option>`).join("")}</select><select onchange="left=+this.value*60;draw()"><option value="10">10 phút</option><option value="15" ${left==900?"selected":""}>15 phút</option><option value="25">25 phút</option></select></div><div class="row" style="justify-content:center"><button class="btn g" onclick="tick()">${timer?"Tạm dừng":"Bắt đầu"}</button></div></div>`}
function tick(){if(timer){clearInterval(timer);timer=null;draw();return}const tot=left;timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);timer=null;S.logs.push({d:Date.now(),m:Math.round(tot/60),s:subj,n:"Học cùng nhau"});starAdd(2);save();left=900;alert("Hoàn thành! Cả hai nhận 2 sao ⭐");draw();return}const e=$("tm");if(e)e.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0")},1000);draw()}

return `<div class="card"><h2>Lịch cả nhà trong tuần</h2><div class="row"><select id="ed">${DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select><input id="et" type="time" value="19:00"><select id="ew">${WHO.map(w=>`<option>${w}</option>`).join("")}</select><input id="en" placeholder="Việc gì?" style="flex:1"><button class="btn g" onclick="addEv()">Thêm</button></div>
<div class="week">${DAYS.map((d,i)=>`<div class="day"><h3>${d}</h3>${S.ev.map((e,k)=>({e,k})).filter(o=>o.e.day==i).sort((a,b)=>a.e.time>b.e.time?1:-1).map(o=>`<div class="ev" style="border-color:${COLS[o.e.who]}" title="Chạm để xoá" onclick="S.ev.splice(${o.k},1);save();draw()">${o.e.time}<br>${esc(o.e.title)}<br><span class="mut">${o.e.who}</span></div>`).join("")}</div>`).join("")}</div></div>
<div class="card" style="margin-top:14px"><h2>💞 Thời gian dành cho nhau</h2><div class="bar"><i style="width:${Math.min(100,tg/(S.goalH*60)*100)}%"></i></div><p class="mut">${(tg/60).toFixed(1)} giờ / mục tiêu <input type="number" value="${S.goalH}" style="width:64px" onchange="S.goalH=+this.value||1;save();draw()"> giờ mỗi tuần</p>

<script>

return `<div class="grid"><div class="card"><h2>Tháng này</h2><div class="row"><span class="pill inc">Thu ${fm(inc)}</span><span class="pill exp">Chi ${fm(ex)}</span><span class="pill">Còn ${fm(inc-ex)}</span></div>
${Object.entries(cats).map(([c,v])=>`<div class="mut">${c} · ${fm(v)}</div><div class="bar" style="height:12px;margin-bottom:6px"><i style="width:${v/mx*100}%;background:var(--coral)"></i></div>`).join("")||'<p class="mut">Chưa có khoản chi nào.</p>'}</div>
<div class="card"><h2>${ic("piggy")} ${esc(S.piggy.name)}</h2><div style="display:flex;justify-content:center">${chibi("boy",80)}</div><div class="bar"><i style="width:${Math.min(100,sav()/S.piggy.goal*100)}%"></i></div><p class="mut">${fm(sav())} / ${fm(S.piggy.goal)} · <a href="#" onclick="event.preventDefault();const g=+prompt('Mục tiêu (đồng)?',S.piggy.goal);if(g){S.piggy.goal=g;save();draw()}">đổi mục tiêu</a></p></div></div>
<div class="card" style="margin-top:14px"><h2>Ghi một khoản</h2><div class="row"><select id="xk"><option value="out">Chi</option><option value="in">Thu</option><option value="save">Bỏ heo đất</option></select><select id="xc">${["Ăn uống","Học tập","Đi lại","Nhà cửa","Vui chơi","Khác"].map(c=>`<option>${c}</option>`).join("")}</select><input id="xa" type="number" placeholder="Số tiền" style="width:130px"><input id="xn" placeholder="Ghi chú" style="flex:1"><button class="btn g" onclick="addTx()">Thêm</button></div>
<div class="list">${S.tx.map((t,i)=>({t,i})).reverse().slice(0,10).map(o=>`<div><span class="g">${esc(o.t.n||o.t.c)} <span class="mut">${o.t.date}</span></span><b class="${o.t.k=="out"?"exp":"inc"}">${o.t.k=="out"?"−":"+"}${fm(o.t.a)}</b><button class="btn sm c" onclick="S.tx.splice(${o.i},1);save();draw()">Xoá</button></div>`).join("")}</div></div>`}
function addTx(){const a=+$("xa").value;if(!a)return;S.tx.push({k:$("xk").value,c:$("xc").value,a,n:$("xn").value,date:today()});save();draw()}
/* ===== Sao riêng từng thành viên · việc nhà có duyệt · đổi quà có số lượng ===== */
const CF={kid:"Con",parent:"Người lớn",all:"Mọi người"};
const cfOK=(f,u)=>!!u&&(f=="all"||(f=="parent"?u.role!="kid":u.role=="kid"));
const cfSel=(id,v)=>`<select id="${id}">${Object.entries(CF).map(([k,l])=>`<option value="${k}" ${k==v?"selected":""}>${l}</option>`).join("")}</select>`;
const hh=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const tmS=ts=>new Date(ts).toLocaleString("vi-VN",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"});
function starInit(){
 S.bal=S.bal||{};S.earn=S.earn||{};S.sl=S.sl||[];S.cq=S.cq||[];S.rx=S.rx||[];S.tg=S.tg||{};
 if(!S.bmig){S.bmig=1;const k=(S.users||[]).find(u=>u.role=="kid");if(k&&S.stars>0&&S.bal[k.id]==null){S.bal[k.id]=S.stars;S.earn[k.id]=S.stars}}
 S.chores.forEach(c=>{if(!c.id)c.id="c"+hh(c.t);if(!c.f)c.f="kid"});
 S.rewards.forEach(r=>{if(!r.id)r.id="r"+hh(r.t);if(r.q==null)r.q=5;if(!r.f)r.f="kid"})
}
function starBal(uid){return (S.bal&&S.bal[uid||ME])||0}
function starAdd(n,uid,o){o=o||{};uid=uid||ME;const u=S.users.find(x=>x.id==uid);if(!u||(u.role!="kid"&&!o.force))return false;S.bal[uid]=(S.bal[uid]||0)+n;if(S.bal[uid]<0&&!o.neg)S.bal[uid]=0;if(n>0||o.rev)S.earn[uid]=Math.max(0,(S.earn[uid]||0)+n);S.sl.push({u:uid,n,w:o.why||"",ts:Date.now()});if(S.sl.length>300)S.sl=S.sl.slice(-300);return true}
const cqOf=(cid,uid,day)=>S.cq.filter(q=>q.cid==cid&&q.by==uid&&q.day==day).sort((a,b)=>b.ts-a.ts)[0];
const pendN=()=>isP()?S.cq.filter(q=>q.st=="pend"&&q.by!=ME&&U(q.by)).length:0;
function chores(){const td=today(),m=U(ME),P=isP(),mine=S.chores.filter(c=>cfOK(c.f,m));
const row=c=>{const q=cqOf(c.id,ME,td),ok=q&&q.st=="ok",pe=q&&q.st=="pend",no=q&&q.st=="no";
return `<div style="flex-wrap:wrap"><span class="g"><span style="color:${ok?"var(--mint)":pe?"#E0A800":"var(--mut)"}">${ic(ok?"ok":pe?"clock":"dot",22)}</span> ${esc(c.t)}${no?'<br><span style="color:var(--coral);font-size:13px;font-weight:700">Chưa đạt, hãy làm lại nhé</span>':""}</span><span class="pill">+${c.s} ${ic("star",13,1)}</span>${ok?'<span class="pill inc">Đã được duyệt</span>':pe?`<span class="pill">${P?"Chờ người còn lại kiểm tra":"Chờ ba mẹ kiểm tra"}</span>`:`<button class="btn sm g" onclick="cSub('${c.id}')">${P?"Tôi đã làm xong":"Đã hoàn thành"}</button>`}</div>`};
const pend=P?S.cq.filter(q=>q.st=="pend"&&q.by!=ME&&U(q.by)).sort((a,b)=>a.ts-b.ts):[],wait=P?S.cq.filter(q=>q.st=="pend"&&q.by==ME).length:0;
const chk=q=>{const u=U(q.by),pr=u.role!="kid";return `<div style="flex-wrap:wrap"><span class="g"><b>${esc(u.name)}</b>: ${esc(q.t)}<br><span class="mut">${q.day==td?"Hôm nay":esc(q.day)} · ${tmS(q.ts)} · +${q.s} sao</span></span><button class="btn sm g" onclick="cChk('${q.id}',1)">${pr?"Đánh giá tốt":"Xác nhận"}</button><button class="btn sm c" onclick="cChk('${q.id}',0)">${pr?"Chưa tốt":"Chưa đạt"}</button></div>`};
const H=S.cq.filter(q=>P||q.by==ME).sort((a,b)=>b.ts-a.ts).slice(0,10),SN={pend:"Chờ kiểm tra",ok:"Đã duyệt",no:"Chưa đạt"};
const card=(h,b)=>`<div class="card" style="margin-bottom:14px"><h2>${h}</h2>${b}</div>`;
return (P?card(ic("ok")+" Cần kiểm tra"+(pend.length?` (${pend.length})`:""),`<div class="list">${pend.map(chk).join("")||'<p class="mut">Không có việc nào đang chờ kiểm tra.</p>'}</div>${wait?`<p class="mut">${wait} việc của bạn đang chờ người còn lại đánh giá.</p>`:""}<p class="mut">Con hoàn thành, ba mẹ xác nhận thì con được cộng sao. Ba mẹ làm việc nhà thì người còn lại đánh giá.</p>`):"")
+card("Việc nhà hôm nay",`<div class="list">${mine.map(row).join("")||'<p class="mut">Chưa có việc nào dành cho bạn.</p>'}</div>${P?"":'<p class="mut">Làm xong thì bấm “Đã hoàn thành”, ba mẹ kiểm tra rồi con sẽ nhận sao.</p>'}`)
+(P?card("Quản lý việc nhà",`<div class="list">${S.chores.map(c=>`<div style="flex-wrap:wrap"><span class="g">${esc(c.t)} <span class="mut">${CF[c.f]||"Con"}</span></span><label class="mut">Sao <input type="number" min="1" value="${c.s}" style="width:64px" onchange="cEd('${c.id}',this.value)"></label><button class="btn sm c" onclick="cDel('${c.id}')">Xoá</button></div>`).join("")||'<p class="mut">Chưa có việc nhà nào.</p>'}</div><div class="row"><input id="ct" placeholder="Việc mới" style="flex:1"><input id="cs" type="number" min="1" value="2" style="width:64px">${cfSel("cf","kid")}<button class="btn sm p" onclick="cAdd()">Thêm</button></div>`):"")
+card(ic("note")+" Lịch sử gần đây",`<div class="list">${H.map(q=>`<div><span class="g">${P&&U(q.by)?esc(U(q.by).name)+": ":""}${esc(q.t)}<br><span class="mut">${tmS(q.ts)}</span></span><span class="pill">${SN[q.st]}${q.st=="ok"?" +"+q.s:""}</span></div>`).join("")||'<p class="mut">Chưa có việc nào được ghi nhận.</p>'}</div>`)}
function cSub(id){const c=S.chores.find(x=>x.id==id),td=today();if(!c||!cfOK(c.f,U(ME)))return;const q=cqOf(id,ME,td);if(q&&q.st!="no")return;S.cq.push({id:"q"+Date.now()+ME,cid:id,t:c.t,s:c.s,by:ME,day:td,ts:Date.now(),st:"pend"});if(S.cq.length>400)S.cq=S.cq.filter(x=>x.st=="pend").concat(S.cq.filter(x=>x.st!="pend").slice(-300));save();draw()}
function cChk(id,ok){if(!isP())return;const q=S.cq.find(x=>x.id==id);if(!q||q.st!="pend")return;if(q.by==ME){alert("Việc này cần người còn lại kiểm tra nhé.");return}const u=U(q.by);q.st=ok?"ok":"no";q.ck=ME;q.ts2=Date.now();
if(ok){starAdd(q.s,q.by,{force:1,why:"Việc nhà: "+q.t});if(u&&u.role=="kid")(S.done[q.day]=S.done[q.day]||[]).push(q.cid)}
save();if(u)sendMsg(ok?`${me().name} đã xác nhận: ${q.t}. Bạn được +${q.s} sao!`:`${me().name} xem rồi, việc “${q.t}” chưa đạt, hãy làm lại nhé.`,q.by);draw()}
function cAdd(){if(!isP())return;const t=$("ct").value.trim();if(!t)return;S.chores.push({id:"c"+Date.now(),t,s:Math.max(1,+$("cs").value||1),f:$("cf").value});save();draw()}
function cEd(id,v){if(!isP())return;const c=S.chores.find(x=>x.id==id);if(!c)return;c.s=Math.max(1,Math.floor(+v)||1);save();draw()}
function cDel(id){if(!isP()||!confirm("Xoá việc nhà này?"))return;S.chores=S.chores.filter(x=>x.id!=id);save();draw()}
function shopTab(){const m=U(ME),P=isP(),wk=Date.now()-6048e5,list=S.rewards.filter(r=>P||cfOK(r.f,m));
const prog=S.users.map(u=>{const b=starBal(u.id),e=S.earn[u.id]||0,w=S.sl.filter(x=>x.u==u.id&&x.n>0&&x.ts>wk).reduce((a,x)=>a+x.n,0),g=S.rewards.find(r=>r.id==S.tg[u.id]&&cfOK(r.f,u)),pc=g?Math.max(0,Math.min(100,b/g.c*100)):0;
return `<div style="flex-wrap:wrap">${chibi(u.av,40)}<span class="g"><b>${esc(u.name)}</b> <span class="mut">${u.role=="kid"?"Con":"Người lớn"}</span><br><span class="mut">Đã kiếm ${e} sao · tuần này +${w}</span></span><span class="pill">${ic("star",14,1)} ${b}</span>${g?`<div style="flex:1 1 100%"><div class="bar" style="height:12px"><i style="width:${pc}%"></i></div><span class="mut">Mục tiêu: ${esc(g.t)} (${g.c} sao) · ${g.q<=0?"quà đã hết":b>=g.c?"đủ sao để đổi rồi":"còn "+(g.c-b)+" sao nữa"}</span></div>`:""}</div>`}).join("");
const item=r=>{const mineOK=cfOK(r.f,m),out=!(r.q>0),goal=S.tg[ME]==r.id;
return `<div style="flex-wrap:wrap"><span class="g"><b>${esc(r.t)}</b><br><span class="mut">Dành cho ${CF[r.f]||"Con"} · ${out?'<b style="color:var(--coral)">Hết quà</b>':"còn "+r.q+" phần"}</span></span><span class="pill">${r.c} ${ic("star",13,1)}</span>${mineOK?`<button class="btn sm ${goal?"p":""}" onclick="rGoal('${r.id}')">${goal?"Đang là mục tiêu":"Đặt mục tiêu"}</button><button class="btn sm y" ${out?"disabled":""} onclick="rBuy('${r.id}')">Đổi</button>`:""}${P?`<div class="row" style="flex:1 1 100%;margin:0"><label class="mut">Giá <input type="number" min="1" value="${r.c}" style="width:70px" onchange="rEd('${r.id}','c',this.value)"> sao</label><label class="mut">Số lượng <input type="number" min="0" value="${r.q}" style="width:70px" onchange="rEd('${r.id}','q',this.value)"></label><button class="btn sm c" onclick="rDel('${r.id}')">Xoá</button></div>`:""}</div>`};
const X=S.rx.filter(x=>P||x.u==ME).slice().sort((a,b)=>b.ts-a.ts).slice(0,10);
const card=(h,b)=>`<div class="card" style="margin-bottom:14px"><h2>${h}</h2>${b}</div>`;
return card(ic("star")+" Tiến độ sao của cả nhà",`<div class="list">${prog}</div><p class="mut">Sao kiếm được từ việc nhà đã được duyệt, học và chơi cùng nhau.</p>`)
+card(ic("gift")+" Đổi quà",`<p style="margin:0 0 6px;font-weight:800">Bạn đang có ${ic("star",16,1)} ${starBal()} sao</p><div class="list">${list.map(item).join("")||'<p class="mut">Chưa có phần quà nào.</p>'}</div>${P?`<div class="row"><input id="rt" placeholder="Phần quà mới" style="flex:1;min-width:140px"><input id="rc" type="number" min="1" value="10" style="width:64px" aria-label="Số sao"><input id="rq" type="number" min="1" value="3" style="width:64px" aria-label="Số lượng">${cfSel("rf","kid")}<button class="btn sm p" onclick="rAdd()">Thêm</button></div><p class="mut">Mỗi lần đổi, số lượng của phần quà giảm đi 1.</p>`:""}`)
+card(ic("note")+" Quà đã đổi",`<div class="list">${X.map(x=>`<div><span class="g">${P&&U(x.u)?esc(U(x.u).name)+": ":""}${esc(x.t)}<br><span class="mut">${tmS(x.ts)}</span></span><span class="pill">−${x.c} ${ic("star",13,1)}</span></div>`).join("")||'<p class="mut">Chưa đổi phần quà nào.</p>'}</div>`)}
function rBuy(id){const r=S.rewards.find(x=>x.id==id),u=U(ME);if(!r||!cfOK(r.f,u))return;if(!(r.q>0)){alert("Phần quà này đã hết rồi.");draw();return}const b=starBal();if(b<r.c){alert("Cần thêm "+(r.c-b)+" sao nữa. Cố lên nào!");return}
if(!starAdd(-r.c,ME,{force:1,why:"Đổi quà: "+r.t}))return;r.q--;S.rx.push({id:"x"+Date.now(),u:ME,t:r.t,c:r.c,ts:Date.now()});if(S.rx.length>200)S.rx=S.rx.slice(-200);save();
S.users.filter(x=>x.role!="kid"&&x.id!=ME).forEach(p=>sendMsg(`${u.name} vừa đổi quà: ${r.t}`,p.id));alert("Đã đổi: "+r.t+". Còn lại "+r.q+" phần.");draw()}
function rGoal(id){S.tg[ME]=S.tg[ME]==id?null:id;save();draw()}
function rAdd(){if(!isP())return;const t=$("rt").value.trim();if(!t)return;S.rewards.push({id:"r"+Date.now(),t,c:Math.max(1,+$("rc").value||1),q:Math.max(1,Math.floor(+$("rq").value)||1),f:$("rf").value});save();draw()}
function rEd(id,f,v){if(!isP())return;const r=S.rewards.find(x=>x.id==id);v=Math.floor(+v);if(!r||isNaN(v))return;r[f]=Math.max(f=="c"?1:0,v);save();draw()}
function rDel(id){if(!isP()||!confirm("Xoá phần quà này?"))return;S.rewards=S.rewards.filter(x=>x.id!=id);save();draw()}
WORDS.push(["🍌","banana","quả chuối"],["🐘","elephant","con voi"],["🌳","tree","cái cây"],["✏️","pencil","bút chì"],["🎂","cake","bánh kem"],["☔","umbrella","cái ô"],["🚲","bike","xe đạp"],["🦋","butterfly","con bướm"]);
S.moods=S.moods||{};S.goals=S.goals||[];S.trc=S.trc||0;S.spc=S.spc||0;
const SPELL=["sáng sủa","xinh xắn","trường học","chăm chỉ","giản dị","rực rỡ","nghỉ ngơi","con chuồn chuồn","dòng sông","giúp đỡ","kỷ niệm","ngày mai"];
const TR=[["Thủ đô của Việt Nam là gì?",["Hà Nội","Huế","Đà Nẵng"],0],["Con vật nào được gọi là chúa sơn lâm?",["Hổ","Mèo","Thỏ"],0],["Một tuần có mấy ngày?",["5","7","10"],1],["Mặt trời mọc ở hướng nào?",["Đông","Tây","Bắc"],0],["Cầu vồng có mấy màu?",["5","7","9"],1],["Chúng ta đang sống trên hành tinh nào?",["Sao Hoả","Mặt Trăng","Trái Đất"],2],["Nước đóng băng ở bao nhiêu độ C?",["0","50","100"],0],["Sông Hương chảy qua thành phố nào?",["Cần Thơ","Huế","Hà Nội"],1],["Loài vật nào biết bay và ăn sâu bọ ban đêm?",["Dơi","Gà","Cá"],0]];
let sp={i:Math.random()*SPELL.length|0,show:false,msg:""},tv={i:Math.random()*TR.length|0,pick:-1};
function say(t,l){try{const u=new SpeechSynthesisUtterance(t);u.lang=l||"en-US";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const starUp=()=>{$("stars").innerHTML=ic("star",18,1)+" "+starBal()};
function spell(){const w=SPELL[sp.i];return `<div class="card"><h2>${ic("edit")} Ba mẹ đọc, con viết</h2><p class="mut">Ba mẹ bấm “Hiện từ”, đọc to một lần rồi ẩn đi. Con viết lại từ vừa nghe.</p><div class="q" style="font-size:32px">${sp.show?esc(w):"• • • • •"}</div><div class="row" style="justify-content:center"><button class="btn y" onclick="sp.show=!sp.show;draw()">${sp.show?"Ẩn từ":"Hiện từ"}</button><button class="btn" onclick="say('${w}','vi-VN')">Nghe máy đọc</button></div><div class="row" style="justify-content:center"><input id="sw" placeholder="Con viết ở đây" style="font-size:22px;width:220px;text-align:center" onkeydown="if(event.key=='Enter')chkSp()"><button class="btn g" onclick="chkSp()">Kiểm tra</button></div><p id="spm" style="text-align:center;font-weight:800;min-height:24px">${sp.msg}</p></div>`}
function chkSp(){const v=$("sw").value.trim().toLowerCase().normalize("NFC");if(!v)return;const ok=v===SPELL[sp.i].normalize("NFC");$("spm").textContent=ok?"Chính xác! Giỏi lắm!":"Chưa đúng rồi, con thử lại nhé.";if(ok){starAdd(1);S.spc++;save();starUp();sp.i=Math.random()*SPELL.length|0;sp.show=false;setTimeout(draw,1200)}}

return `<div class="card" style="margin-bottom:14px"><h2>${ic("flame")} Điểm trừ${pend.length?` (${pend.length} khiếu nại)`:""}</h2>${form}${pend.length?`<p style="margin:8px 0 0;font-weight:800">Khiếu nại chờ bạn phản hồi</p><div class="list">${pc}</div>`:""}${hint}<div class="list">${rest.map(row).join("")||(pend.length?"":`<p class="mut">${T.length?"Chưa có lần trừ sao nào.":"Bạn chưa bị trừ sao."}</p>`)}</div></div>`}
function pnAdd(){const t=U($("pnu")&&$("pnu").value),n=Math.floor(+$("pnn").value),w=$("pnw").value.trim();
if(!t||!pnCan(t)){alert("Bạn chỉ trừ được sao của người có cấp bậc thấp hơn.");return}
if(!(n>=1))return;if(!w){alert("Hãy ghi rõ lý do trừ sao.");return}
starAdd(-n,t.id,{neg:1,force:1,why:"Trừ sao: "+w});
S.pn.push({id:"n"+Date.now(),u:t.id,n,why:w,by:ME,ts:Date.now()});if(S.pn.length>200)S.pn=S.pn.slice(-200);
save();sendMsg(`${me().name} trừ ${n} sao. Lý do: ${w}. Nếu thấy chưa đúng, bạn có thể khiếu nại ở tab Đổi quà.`,t.id);draw()}
function apSend(id){const x=S.pn.find(r=>r.id==id),i=$("pna_"+id),w=i&&i.value.trim();
if(!x||x.u!=ME||x.rf||x.ap)return;if(!w){alert("Hãy ghi lý do khiếu nại.");return}
x.ap={st:"pend",why:w,ts:Date.now()};pnAp=null;save();
S.users.filter(u=>u.id!=ME&&rk(u)>=pnR(x)).forEach(u=>sendMsg(`${me().name} khiếu nại việc bị trừ ${x.n} sao (${x.why}). Lý do khiếu nại: ${w}. Mời vào tab Đổi quà để phản hồi.`,u.id));draw()}
function apAns(id,ok){const x=S.pn.find(r=>r.id==id);if(!x||!x.ap||x.ap.st!="pend"||!pnDec(x))return;
const i=$("pnr_"+id),a=i&&i.value.trim();if(!a){alert("Hãy viết phản hồi cho "+(U(x.u)?U(x.u).name:"người khiếu nại")+".");return}
if(ok){starAdd(x.n,x.u,{force:1,why:"Hoàn sao: "+x.why});S.earn[x.u]=Math.max(0,(S.earn[x.u]||0)-x.n);x.rf=1}
x.ap.st=ok?"rev":"keep";x.ap.ans=a;x.ap.by=ME;x.ap.ts2=Date.now();save();
sendMsg(ok?`${me().name} đã xem khiếu nại và hoàn lại ${x.n} sao. Phản hồi: ${a}`:`${me().name} đã xem khiếu nại và giữ nguyên điểm trừ ${x.n} sao. Phản hồi: ${a}`,x.u);draw()}
function pnUndo(id){const x=S.pn.find(r=>r.id==id);if(!x||x.rf||!pnDec(x))return;if(!confirm("Hoàn lại số sao đã trừ?"))return;
starAdd(x.n,x.u,{force:1,why:"Hoàn sao: "+x.why});S.earn[x.u]=Math.max(0,(S.earn[x.u]||0)-x.n);x.rf=1;
if(x.ap&&x.ap.st=="pend"){x.ap.st="rev";x.ap.ans="Đã hoàn lại sao";x.ap.by=ME;x.ap.ts2=Date.now()}
save();sendMsg(`${me().name} đã hoàn lại ${x.n} sao cho bạn.`,x.u);draw()}
{const d2=draw;draw=function(){d2();if(!me())return;const n=apN();if(S.tab=="home"&&n>0)$("app").insertAdjacentHTML("afterbegin",`<div class="card hero" style="margin-bottom:14px;padding:12px"><div style="font-weight:800;flex:1">Có ${n} khiếu nại điểm trừ đang chờ phản hồi</div><button class="btn y" onclick="go('shop')">Xem ngay</button></div>`)}}

/* ===== 10. Cấp dưới khiếu nại và đề nghị trừ sao cấp trên · cấp 2 trở lên xem xét, nhận định ===== */
SYNCK.push("pp");
{const f1=starInit;starInit=function(){f1();S.pp=S.pp||[]}}starInit();
{const s1=shopTab;shopTab=function(){return s1()+ppCard()}}
const ppNm=id=>U(id)?U(id).name:"Ba mẹ";
const ppJ=x=>!!x&&!!me()&&rk(me())>=2&&ME!=x.u&&ME!=x.by;
const ppSee=x=>x.by==ME||x.u==ME||ppJ(x);
const ppN=()=>me()?S.pp.filter(x=>x.st=="pend"&&ppJ(x)).length:0;
function ppCard(){const m=me();if(!m)return"";
const T=S.users.filter(u=>u.id!=ME&&rk(u)>rk(m)),L=S.pp.filter(ppSee).sort((a,b)=>b.ts-a.ts),
pend=L.filter(x=>x.st=="pend"&&ppJ(x)),rest=L.filter(x=>!pend.includes(x)).slice(0,12),
nm=id=>esc(ppNm(id)),SL={pend:"Đang chờ xem xét",ok:"Đã chấp nhận, đã trừ sao",no:"Không chấp nhận"};
if(!T.length&&!L.length)return"";
const row=x=>`<div style="flex-wrap:wrap"><span class="g"><b>${nm(x.by)} → ${nm(x.u)} · −${x.n} sao</b> <span class="pill">${x.rf?"Đã hoàn lại":SL[x.st]||""}</span><br><span>${esc(x.why)}</span><br><span class="mut">${tmS(x.ts)}</span>${x.ans?`<br><span class="mut">Nhận định (${nm(x.jb)}): ${esc(x.ans)}</span>`:""}</span>${x.st=="ok"&&!x.rf&&ppJ(x)?`<button class="btn sm y" onclick="ppUndo('${x.id}')">Hoàn lại</button>`:""}</div>`;
const pc=pend.map(x=>`<div style="flex-wrap:wrap"><span class="g"><b>${nm(x.by)} đề nghị trừ ${x.n} sao của ${nm(x.u)}</b><br><span>Lý do: ${esc(x.why)}</span><br><span class="mut">${tmS(x.ts)}</span></span><div class="row" style="flex:1 1 100%;margin:0"><input id="ppr_${x.id}" placeholder="Nhận định của bạn (bắt buộc)" style="flex:1;min-width:160px"><button class="btn sm c" onclick="ppAns('${x.id}',1)">Chấp nhận, trừ sao</button><button class="btn sm g" onclick="ppAns('${x.id}',0)">Không chấp nhận</button></div></div>`).join("");
const form=T.length?`<div class="row"><select id="ppu">${T.map(u=>`<option value="${u.id}">${esc(u.name)} · ${rkL(rk(u))}</option>`).join("")}</select><input id="ppq" type="number" min="1" value="1" style="width:70px" aria-label="Số sao đề nghị trừ"><input id="ppw" placeholder="Vì sao bạn đề nghị trừ? (bắt buộc)" style="flex:1;min-width:160px"><button class="btn sm p" onclick="ppAdd()">Gửi đề nghị</button></div><p class="mut">Bạn có thể khiếu nại và đề nghị trừ sao người có cấp bậc cao hơn. Những người từ cấp 2 trở lên (trừ bạn và người bị đề nghị) sẽ xem xét và nhận định. Chỉ khi được chấp nhận thì sao mới bị trừ.</p>`:"";
return `<div class="card" style="margin-bottom:14px"><h2>${ic("flame")} Đề nghị trừ sao cấp trên${pend.length?` (${pend.length} chờ xem xét)`:""}</h2>${form}${pend.length?`<p style="margin:8px 0 0;font-weight:800">Đề nghị chờ bạn xem xét</p><div class="list">${pc}</div>`:""}<div class="list">${rest.map(row).join("")||(pend.length?"":`<p class="mut">Chưa có đề nghị nào.</p>`)}</div></div>`}
function ppAdd(){const t=U($("ppu")&&$("ppu").value),n=Math.floor(+$("ppq").value),w=$("ppw").value.trim();
if(!t||t.id==ME||rk(t)<=rk(me())){alert("Bạn chỉ đề nghị trừ sao được người có cấp bậc cao hơn.");return}
if(!(n>=1))return;if(!w){alert("Hãy ghi rõ lý do đề nghị.");return}
const J=S.users.filter(u=>u.id!=ME&&u.id!=t.id&&rk(u)>=2);
if(!J.length){alert("Chưa có ai từ cấp 2 trở lên (ngoài bạn và "+t.name+") để xem xét đề nghị này.");return}
S.pp.push({id:"p"+Date.now(),u:t.id,n,why:w,by:ME,ts:Date.now(),st:"pend"});if(S.pp.length>200)S.pp=S.pp.slice(-200);
save();J.forEach(u=>sendMsg(`${me().name} khiếu nại và đề nghị trừ ${n} sao của ${t.name}. Lý do: ${w}. Mời vào tab Đổi quà để xem xét và nhận định.`,u.id));draw()}
function ppAns(id,ok){const x=S.pp.find(r=>r.id==id);if(!x||x.st!="pend"||!ppJ(x))return;
const i=$("ppr_"+id),a=i&&i.value.trim();if(!a){alert("Hãy viết nhận định của bạn.");return}
if(ok){if(!U(x.u)){alert("Người này không còn trong gia đình.");return}starAdd(-x.n,x.u,{neg:1,force:1,why:"Trừ sao (cấp dưới đề nghị): "+x.why})}
x.st=ok?"ok":"no";x.ans=a;x.jb=ME;x.ts2=Date.now();save();
sendMsg(ok?`${me().name} đã xem xét đề nghị của bạn về ${ppNm(x.u)} và chấp nhận, trừ ${x.n} sao. Nhận định: ${a}`:`${me().name} đã xem xét đề nghị của bạn về ${ppNm(x.u)} và không chấp nhận. Nhận định: ${a}`,x.by);
if(ok&&U(x.u))sendMsg(`${ppNm(x.by)} đề nghị trừ ${x.n} sao của bạn (${x.why}). ${me().name} đã xem xét và chấp nhận. Nhận định: ${a}`,x.u);draw()}
function ppUndo(id){const x=S.pp.find(r=>r.id==id);if(!x||x.st!="ok"||x.rf||!ppJ(x))return;if(!confirm("Hoàn lại số sao đã trừ?"))return;
starAdd(x.n,x.u,{force:1,why:"Hoàn sao: "+x.why});S.earn[x.u]=Math.max(0,(S.earn[x.u]||0)-x.n);x.rf=1;
save();sendMsg(`${me().name} đã hoàn lại ${x.n} sao cho bạn.`,x.u);draw()}
{const d3=draw;draw=function(){d3();if(!me())return;const n=ppN();if(S.tab=="home"&&n>0)$("app").insertAdjacentHTML("afterbegin",`<div class="card hero" style="margin-bottom:14px;padding:12px"><div style="font-weight:800;flex:1">Có ${n} đề nghị trừ sao cấp trên đang chờ bạn xem xét</div><button class="btn y" onclick="go('shop')">Xem ngay</button></div>`)}}

draw();
</script>
<script>
/* ===== 11. Ba mẹ xem lịch sử + điểm của con, xoá khi nhầm ===== */
TABS.splice(TABS.findIndex(t=>t[0]=="fam"),0,["kidh","note","Của con","#12B5CB"]);
let KH=null;
const khKids=()=>S.users.filter(u=>u.role=="kid");
function khTab(){
const ks=khKids();if(!ks.some(u=>u.id==KH))KH=ks.length?ks[0].id:null;const id=KH,u=U(id);
const card=(h,b)=>`<div class="card" style="margin-bottom:14px"><h2>${h}</h2>${b}</div>`,none=t=>`<p class="mut">${t}</p>`;
if(!u)return card(ic("note")+" Lịch sử của con",none("Chưa có tài khoản của con. Thêm ở tab Gia đình."));
const del=f=>`<button class="btn sm c" onclick="${f}">Xoá</button>`,
mins=S.logs.reduce((a,l)=>a+l.m,0),
sel=ks.length>1?`<select onchange="KH=this.value;draw()">${ks.map(k=>`<option value="${k.id}" ${k.id==id?"selected":""}>${esc(k.name)}</option>`).join("")}</select>`:"",
SL=S.sl.filter(x=>x.u==id).sort((a,b)=>b.ts-a.ts).slice(0,30).map(x=>{const ok=x.n>0&&!/^Hoàn sao/.test(x.w||"");return `<div><span class="g"><b style="color:var(--${x.n>0?"mint":"coral"})">${x.n>0?"+":""}${x.n}</b> ${esc(x.w||"Sao")}<br><span class="mut">${tmS(x.ts)}</span></span>${ok?del(`khSl('${id}',${x.ts},${x.n})`):""}</div>`}).join(""),
LG=S.logs.slice().sort((a,b)=>b.d-a.d).slice(0,30).map(l=>`<div><span class="g"><b>${esc(l.s||"Học")}</b> · ${l.m} phút${l.n?" · "+esc(l.n):""}<br><span class="mut">${tmS(l.d)}</span></span>${del(`khLog(${l.d},${l.m})`)}</div>`).join(""),
SK=Object.entries(S.sk||{}).filter(([k,t])=>t&&t.n).sort().map(([k,t])=>{const s=(XSK[k[0]]||[]).find(x=>x[0]==k.slice(1));return `<div><span class="g"><b>Lớp ${esc(k[0])}</b> · ${esc(s?s[2]:k.slice(1))}<br><span class="mut">${t.ok}/${t.n} câu đúng · ${Math.round(t.ok/t.n*100)}%</span></span>${del(`khSk('${k}')`)}</div>`}).join(""),
sc=[["Đố nhau toán","me"],["Đố vui đúng","trc"],["Chính tả đúng","spc"]].filter(a=>S[a[1]]>0).map(a=>`<div><span class="g">${a[0]}: <b>${S[a[1]]}</b></span>${del(`khSc('${a[1]}')`)}</div>`),
hs=Object.entries(S.hs||{}).filter(([g,h])=>h&&h[id]!=null).map(([g,h])=>`<div><span class="g">Điểm cao ${esc((GM.find(x=>x[0]==g)||[0,g])[1])}: <b>${h[id]}</b></span>${del(`khHs('${g}','${id}')`)}</div>`),
gw=(S.gs||{})[id]>0?[`<div><span class="g">Số ván thắng: <b>${S.gs[id]}</b></span>${del(`khGs('${id}')`)}</div>`]:[];
return card(ic("note")+" Lịch sử và điểm của "+esc(u.name),`<div class="row"><span class="pill">${ic("star",14,1)} ${starBal(id)} sao</span><span class="pill">Đã kiếm ${S.earn[id]||0}</span><span class="pill">${S.logs.length} buổi học · ${mins} phút</span>${sel}</div><p class="mut">Chỉ ba mẹ thấy mục này. Thấy dữ liệu nào nhầm thì bấm Xoá.</p>`)
+card(ic("star")+" Lịch sử sao",`<div class="list">${SL||none("Chưa có lịch sử sao.")}</div><p class="mut">Xoá dòng cộng sao sẽ trừ lại số sao đó và nhắn cho con biết. Dòng đổi quà hoặc trừ sao xử lý ở tab Đổi quà.</p>`)
+card(ic("book")+" Nhật ký học",`<div class="list">${LG||none("Chưa có buổi học nào.")}</div>`)
+card(ic("spark")+" Điểm luyện bài",`<div class="list">${SK||none("Chưa có điểm luyện bài.")}</div>`)
+card(ic("game")+" Điểm đố vui và trò chơi",`<div class="list">${sc.concat(hs,gw).join("")||none("Chưa có điểm nào.")}</div>`)}
function khSl(u,ts,n){if(!isP())return;const i=S.sl.findIndex(x=>x.u==u&&x.ts==ts&&x.n==n);if(i<0||!confirm("Xoá dòng +"+n+" sao này? Số sao của con sẽ bị trừ lại "+n+" (không xuống dưới 0)."))return;
const w=S.sl[i].w||"không ghi lý do";S.sl.splice(i,1);S.bal[u]=Math.max(0,(S.bal[u]||0)-n);S.earn[u]=Math.max(0,(S.earn[u]||0)-n);save();sendMsg(`${me().name} đã xoá ${n} sao ghi nhầm (${w}).`,u);draw()}
function khLog(d,m){if(!isP())return;const i=S.logs.findIndex(l=>l.d==d&&l.m==m);if(i<0||!confirm("Xoá buổi học này khỏi nhật ký?"))return;S.logs.splice(i,1);save();draw()}
function khSk(k){if(!isP()||!S.sk[k]||!confirm("Xoá điểm luyện bài này?"))return;delete S.sk[k];save();draw()}
function khSc(k){if(!isP()||!["me","trc","spc"].includes(k)||!confirm("Đặt điểm này về 0?"))return;S[k]=0;save();draw()}
function khHs(g,u){if(!isP()||!confirm("Xoá điểm cao này?"))return;if(S.hs[g])delete S.hs[g][u];syncFun();draw()}
function khGs(u){if(!isP()||!confirm("Đặt số ván thắng về 0?"))return;delete S.gs[u];syncFun();draw()}
{const dK=draw;draw=function(){const P=!!me()&&isP(),w=P&&S.tab=="kidh";if(!P&&S.tab=="kidh")S.tab="home";const tn=S.tab;if(w)S.tab="home";dK();if(w)S.tab=tn;if(!me())return;
const nv=$("nav");if(nv){if(!P)nv.querySelectorAll("[onclick=\"go('kidh')\"]").forEach(b=>b.remove());if(w)nv.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.getAttribute("onclick")=="go('kidh')"))}
if(w)$("app").innerHTML=khTab()}}
draw();
</script>
